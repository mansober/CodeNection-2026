[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "icalendar>=6.3,<8",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0",
    "recurring-ical-events>=3,<4",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
